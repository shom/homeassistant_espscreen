# ESP Screens - a Guition panel on an ESP32-P4 with an ESP32-C6 for Wi-Fi, for a board file that includes this one.
#
# The P4 and its Wi-Fi co-processor are hardware/esp32p4-c6.yaml. What the 10.1-inch JC8012P4A1 and the 7-inch
# JC1060P470 add to it, pin for pin: 16 MB of flash and the backlight's pin. The board file adds its display and its
# touch panel.
packages:
  p4: !include esp32p4-c6.yaml

esp32:
  flash_size: 16MB

# The backlight, a PWM pin (features/backlight.yaml makes it the light).
output:
  - platform: ledc
    pin: GPIO23
    id: gpio_backlight_pwm
